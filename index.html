<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />

  <title>PARQH Admin Dashboard</title>

  <meta name="theme-color" content="#080D1B" />
  <meta name="description" content="PARQH Admin Management Dashboard" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #080D1B;
      font-family: Inter, Arial, sans-serif;
      color: #ffffff;
      overflow: hidden;
    }

    #root {
      min-height: 100vh;
      position: relative;
      z-index: 1;
    }

    .loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, #17366b 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #25164f 0%, transparent 35%),
        #080D1B;
      z-index: 9999;
    }

    .glow {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: #3678ff;
      filter: blur(130px);
      opacity: 0.25;
      animation: float 5s infinite alternate ease-in-out;
    }

    .loader-content {
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: auto auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 22px;
      background: linear-gradient(135deg, #397BFF, #7654F6);
      box-shadow: 0 0 45px #397bff55;
      font-size: 30px;
      font-weight: 800;
    }

    .brand {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    .subtitle {
      margin-top: 10px;
      font-size: 12px;
      color: #9CAAC5;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .loader {
      width: 190px;
      height: 4px;
      margin: 35px auto 15px;
      border-radius: 10px;
      background: #26334d;
      overflow: hidden;
    }

    .loader::after {
      content: "";
      display: block;
      width: 45%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #397BFF, #A78BFA);
      animation: loading 1.5s infinite ease-in-out;
    }

    .loading-text {
      font-size: 11px;
      color: #8190AC;
      letter-spacing: 2px;
    }

    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }

    @keyframes float {
      from { transform: translate(-30px, -20px); }
      to { transform: translate(40px, 30px); }
    }
  </style>
</head>

<body>

  <div id="root">
    <div class="loading-screen">
      <div class="glow"></div>

      <div class="loader-content">
        <div class="logo">P</div>

        <div class="brand">PARQH</div>

        <div class="subtitle">
          Admin Management System
        </div>

        <div class="loader"></div>

        <div class="loading-text">
          INITIALIZING DASHBOARD...
        </div>
      </div>
    </div>
  </div>

  <!-- Original React Connection - PRESERVED -->
  <script type="module" src="/src/main.tsx"></script>

</body>
</html>
